<form method="get" action="">
        <!-- Sort Dropdown -->
        <label for="sort">Sort By:</label>
        <select name="sort" id="sort">
            {% if not selected_sort %}
                <option value="" selected>Sort By...</option>
            {% else %}
                <option value="{{ selected_sort }}" selected>{{ selected_sort }}</option>
            {% endif %}
            {%  for sort in sorts %}
                {% if sort != selected_sort %}
                    <option value="{{ sort }}">{{ sort }}</option>
                {% endif %}
            {% endfor %}
        </select>

        <!-- Category Dropdown -->
        <label for="category">Category:</label>
        <select name="category" id="category" {% if selected_author %}disabled{% endif %}>
            {% if not selected_category %}
                <option value="" selected>Select Category...</option>
            {% else %}
                <option value="{{ selected_category }}" selected>{{ selected_category }}</option>
            {% endif %}
            {% for category in categories %}
                {% if category != selected_category %}
                    <option value="{{ category }}">{{ category }}</option>
                {% endif %}
            {% endfor %}
        </select>

        <!-- Author Dropdown -->
        <label for="author">Author:</label>
        <select name="author" id="author" {% if selected_category %}disabled{% endif %}>
            {% if not selected_author %}
                <option value="" selected>Select Author...</option>
            {% else %}
                <option value="{{ selected_author }}" selected>{{ selected_author }}</option>
            {% endif %}
            {% for author in authors %}
                {% if author != selected_author %}
                    <option value="{{ author }}">{{ author }}</option>
                {% endif %}
            {% endfor %}
        </select>

        <button type="submit">Go</button>
        <a href="{{ url_for('browse_bp.browse') }}" class="reset-button">Reset</a>
    </form>


    <h1>
         {% if selected_category %}
        Showing category: {{ selected_category }}
        {% elif selected_author %}
            Showing author: {{ selected_author }}
        {% else %}
            Browse recipes:
        {% endif %}
    </h1>
