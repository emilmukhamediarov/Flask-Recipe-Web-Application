<input type="checkbox" id="toggle" {%  if selected_sort or selected_category or selected_author %}checked{% endif %}>
<label for="toggle">Show Filters</label>

<div id="filters" >
    <form method="get" action="">
            <!-- Search Bar -->
{#            None error???? when filter select#}
            <label for="search">Search:</label>
    <input type="search" name="search" id="search" placeholder="Search by name..." value="{{ search_term|default() }}"/>

            <!-- Sort Dropdown -->
            <label for="sort">Sort By:</label>
            <select name="sort" id="sort" onchange="this.form.submit()">
                {% if not selected_sort %}
                    <option value="" selected></option>
                {% else %}
                    <option value="{{ selected_sort }}" selected>{{ selected_sort }}</option>
                {% endif %}
                {%  for sort in sorts %}
                    {% if sort != selected_sort %}
                        <option value="{{ sort }}">{{ sort }}</option>
                    {% endif %}
                {% endfor %}
            </select>

            <!-- Category Dropdown -->
            <label for="category" {% if selected_author %}class="disabled"{% endif %}>Category:</label>
            <select name="category" id="category" {% if selected_author %}disabled{% endif %} onchange="this.form.submit()">
                {% if not selected_category %}
                    <option value="" selected></option>
                {% else %}
                    <option value="{{ selected_category }}" selected>{{ selected_category }}</option>
                {% endif %}
                {% for category in categories %}
                    {% if category != selected_category %}
                        <option value="{{ category }}">{{ category }}</option>
                    {% endif %}
                {% endfor %}
            </select>

            <!-- Author Dropdown -->
            <label for="author" {% if selected_category %}class="disabled"{% endif %}>Author:</label>
            <select name="author" id="author" {% if selected_category %}disabled{% endif %} onchange="this.form.submit()">
                {% if not selected_author %}
                    <option value="" selected></option>
                {% else %}
                    <option value="{{ selected_author }}" selected>{{ selected_author }}</option>
                {% endif %}
                {% for author in authors %}
                    {% if author != selected_author %}
                        <option value="{{ author }}">{{ author }}</option>
                    {% endif %}
                {% endfor %}
            </select>
            <button type="submit" class="reset-button">Go</button>
            <a href="{{ url_for('browse_bp.browse') }}" class="reset-button">Reset</a>
        </form>
</div>

        <h1>
             {% if selected_category %}
            Showing category: {{ selected_category }}
            {% elif selected_author %}
                Showing author: {{ selected_author }}
            {% else %}
                Browse recipes:
            {% endif %}
        </h1>
